# Main proposal: MR-SJPA (per-sample residual trust-region), not a paper baseline.
# Only layer 9 differs from etfnet_dualstream_noCAFEM_noTGF.yaml.
scale: s
ch: 6
nc: 5
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, IN, []]
  - [-1, 1, Multiin, [1]]
  - [-2, 1, Multiin, [2]]
  - [-2, 1, Conv, [64, 3, 2]]
  - [-2, 1, Conv, [64, 3, 2]]
  - [-2, 1, Conv, [128, 3, 2]]
  - [-2, 1, Conv, [128, 3, 2]]
  - [-2, 2, C3k2, [256, False, 0.25]]
  - [-2, 2, C3k2, [256, False, 0.25]]
  # groups, stat_grid, eps, coherence_tau, gate_k, trust_radius,
  # max_shift, shift_penalty, shift_margin
  - [[-2, -1], 1, MR_SJPA, [32, 16, 0.001, 0.30, 10.0, 0.25, 1, 0.01, 0.01]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[23, 26, 29], 1, OBB, [nc, 1]]
